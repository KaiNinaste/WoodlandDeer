<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1610" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316241b'/><text y='.9em' font-size='75' x='12'>🦌</text></svg>" />
  <title>Bramble's Woodland Glade</title>
  <style>
    :root {
      --bg-deep: #0d1610;
      --bg-card: #15221a;
      --bg-card-soft: #1b2c21;
      --border: #2a4032;
      --text-main: #edf5ef;
      --text-muted: #9eb5a6;
      --accent: #7ec895;
      --accent-warm: #e4b567;
      --accent-blue: #7ec4cf;
      --danger: #e27c7c;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
      padding: 12px 12px 54px;
      max-width: 560px;
      margin-inline: auto;
      line-height: 1.45;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--bg-card-soft); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px; font-size: 0.77rem; color: var(--text-main);
    }
    .btn {
      background: var(--bg-card-soft); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 11px;
      padding: 8px 11px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #264833; border-color: var(--accent); color: #eafff0; }
    .btn-warm { background: #3b2f19; border-color: var(--accent-warm); color: #fff4dd; }
    .btn-sm { padding: 5px 9px; font-size: 0.75rem; }
    .glade-wrap {
      border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); margin: 10px 0 8px;
      background: #17272e;
    }
    .bar-bg { height: 8px; background: #0b130e; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
    .bar-warm { background: var(--accent-warm); }
    .tabs {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px; margin-bottom: 12px;
    }
    .tab-btn {
      background: transparent; border: 1px solid transparent; color: var(--text-muted);
      border-radius: 11px; padding: 8px 3px; font-size: 0.71rem; font-weight: 600;
      cursor: pointer; text-align: center; line-height: 1.25;
    }
    .tab-btn.active {
      background: var(--bg-card-soft); border-color: var(--accent); color: var(--text-main);
    }
    .section { display: none; }
    .section.active { display: block; }
    h2 { font-size: 1.05rem; margin: 0 0 6px; }
    h3 { font-size: 0.92rem; margin: 0 0 4px; color: var(--accent-warm); }
    p.muted { color: var(--text-muted); font-size: 0.81rem; margin: 0 0 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .item-card {
      background: var(--bg-card-soft); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px;
    }
    .quest-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-card-soft); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    }
    .quest-row.done { opacity: 0.6; border-color: var(--accent); }
    input, select, textarea {
      width: 100%; background: #0d1610; color: var(--text-main);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; font-size: 0.84rem; font-family: inherit;
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip {
      background: #0d1610; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 999px; padding: 5px 10px; font-size: 0.77rem; cursor: pointer;
    }
    .chip.selected { background: #264833; border-color: var(--accent); color: #fff; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #1f3b2a; border: 1px solid var(--accent); color: #fff;
      padding: 8px 16px; border-radius: 999px; font-size: 0.82rem;
      z-index: 999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      max-width: 90vw; text-align: center;
    }
    @keyframes floatSoft { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes hopJoy { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-7px); } }
    #deer-group { animation: floatSoft 3.5s ease-in-out infinite; cursor: pointer; }
    .hop { animation: hopJoy 0.55s ease 2 !important; }
    @keyframes pulseGlow { 0%,100% { opacity: 0.85; } 50% { opacity: 1; filter: drop-shadow(0 0 6px #ffd479); } }
    .mushroom-pulse { animation: pulseGlow 1.6s ease-in-out 2; }
  </style>
</head>
<body>

  <!-- TOP COMPANION & GLADE CARD -->
  <div class="card">
    <div class="row" style="margin-bottom:8px;">
      <div>
        <div class="row" style="justify-content:flex-start;">
          <strong style="font-size:1.15rem;">Bramble</strong>
          <span class="pill" id="stage-pill">Spotted Fawn · Lv.1</span>
        </div>
        <div style="font-size:0.79rem; color:var(--text-muted);" id="status-line">Waiting peacefully in the mossy glade</div>
      </div>
      <div class="row">
        <button class="btn btn-sm" onclick="exportBackup()">💾 Backup</button>
        <button class="btn btn-sm" onclick="document.getElementById('restore-input').click()">📂 Restore</button>
        <input type="file" id="restore-input" accept=".json" style="display:none" onchange="importBackup(event)" />
      </div>
    </div>

    <!-- Status Pills -->
    <div class="row" style="margin-bottom:6px;">
      <span class="pill">🌿 <strong id="leaves-top">0</strong></span>
      <button class="pill" style="cursor:pointer;" onclick="syncWeather()" id="weather-pill">⛅ Sync Weather</button>
      <span class="pill" id="moon-pill">🌔 Waxing</span>
      <span class="pill" id="sabbat-pill" onclick="switchTab('lore')" style="cursor:pointer;">🍂 Samhain Tide</span>
    </div>

    <!-- Live Deity & Threshold Banner -->
    <div class="item-card" style="padding:8px 10px; margin-bottom:6px; cursor:pointer;" onclick="switchTab('lore')">
      <div class="row">
        <span style="font-size:0.78rem; color:var(--accent-warm);" id="deity-time-badge">🕯️ Dusk Threshold · Gwyn ap Nudd</span>
        <span style="font-size:0.74rem; color:var(--text-muted);" id="deity-day-badge">Friday · Sulis</span>
      </div>
    </div>

    <!-- 100% UNOBSTRUCTED GLADE CANVAS (NO OVERLAYS INSIDE) -->
    <div class="glade-wrap">

            <stop id="sky-top" offset="0%" stop-color="#192934" />

          </linearGradient>
          <radialGradient id="pondGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7fd6f7" />
            <stop offset="100%" stop-color="#276987" />
          </radialGradient>
          <linearGradient id="deerCoatGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="deer-coat-top" offset="0%" stop-color="#c87b42" />
            <stop id="deer-coat-mid" offset="65%" stop-color="#a65c2b" />
            <stop id="deer-coat-belly" offset="100%" stop-color="#f2e4cf" />
          </linearGradient>
          <linearGradient id="deerNeckGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="deer-neck-1" offset="0%" stop-color="#b86b35" />
            <stop id="deer-neck-2" offset="100%" stop-color="#8c4a1f" />
          </linearGradient>
          <linearGradient id="foxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#df6822" />
            <stop offset="70%" stop-color="#b54912" />
            <stop offset="100%" stop-color="#f5efe6" />
          </linearGradient>
          <linearGradient id="cockerGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d47a2a" />
            <stop offset="100%" stop-color="#8f4710" />
          </linearGradient>
          <radialGradient id="whiteAura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff8e3" stop-opacity="0.45" />
            <stop offset="70%" stop-color="#d9f0ff" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Sky & Celestial Orb -->
        <rect width="440" height="245" fill="url(#skyGrad)" />
        <circle id="celestial-orb" cx="375" cy="40" r="16" fill="#f7e5a6" opacity="0.88" />

        <!-- Rolling Somerset Hills -->
        <path d="M0,136 Q115,112 230,134 T440,126 L440,245 L0,245 Z" fill="#1f3825" />
        <path d="M0,156 Q155,142 300,158 T440,150 L440,245 L0,245 Z" fill="#284a30" />

        <!-- Background Woodland Trees -->

        <!-- Seasonal Blossoms / Snowdrops -->
        <g id="seasonal-flora" opacity="0.85"></g>

        <!-- Unlockable: Barn Owl (Majestic Perched Silhouette on Left Bough) -->

          <ellipse cx="63.5" cy="85" rx="5.2" ry="8.5" fill="#fbf7f0" />

          <path d="M58,70 Q61,67 63.5,71 Q66,67 69,70" fill="none" stroke="#a38258" stroke-width="0.9" />
          <circle cx="60.8" cy="71.5" r="1.4" fill="#17120e" />
          <circle cx="66.2" cy="71.5" r="1.4" fill="#17120e" />
          <polygon points="62.8,73 64.2,73 63.5,75.5" fill="#cfa052" />
          <path d="M60,94 L60,97 M66,94 L66,97" stroke="#4a3c31" stroke-width="1.4" stroke-linecap="round" />
        </g>

        <!-- Unlockable: Sulis Sacred Spring Shrine (Far Right) -->
        <g id="decor-sulis" style="display:none; cursor:pointer;" onclick="tapScenery('sulis')">
          <rect x="392" y="138" width="18" height="24" rx="2" fill="#8b968e" />
          <polygon points="389,138 401,128 413,138" fill="#6f7a72" />
          <circle cx="401" cy="148" r="3" fill="#f5c96b" />
        </g>

        <!-- Unlockable: Wildlife Pond (Right Clearing) -->
        <g id="decor-pond" style="display:none; cursor:pointer;" onclick="tapScenery('pond')">
          <ellipse cx="352" cy="194" rx="48" ry="16" fill="url(#pondGrad)" stroke="#73a895" stroke-width="2" />
          <ellipse id="pond-ripple" cx="352" cy="194" rx="22" ry="6" fill="none" stroke="#bcebff" stroke-width="1.2" opacity="0.65" />
          <circle cx="370" cy="191" r="3.8" fill="#f49ac2" />
        </g>

        <!-- Unlockable: Genii Cucullati Trio (Back Mid-Right) -->
        <g id="decor-cucullati" style="display:none; cursor:pointer;" onclick="tapScenery('cucullati')">

        <!-- Unlockable: Mossy Stepping Stones -->

          <path d="M68,180 C53,182 47,173 56,167 C63,163 70,171 72,177 Z" fill="#cf5d1b" />

          <circle cx="94" cy="161" r="1.2" fill="#17110d" />

        </g>

        <!-- Unlockable: Glowing Mushrooms (Front Left) -->
        <g id="decor-mushrooms" style="display:none; cursor:pointer;" onclick="tapScenery('mushrooms')">
          <rect x="34" y="204" width="4.5" height="13" rx="2" fill="#f2eadc" />
          <path d="M25,205 Q36,190 47,205 Z" fill="#e05a47" />
          <circle cx="33" cy="199" r="1.6" fill="#fff6d6" />

          <circle cx="51" cy="205" r="1.3" fill="#fff6d6" />
        </g>

        <!-- Unlockable: Woodland Hedgehog (Detailed Spines & Snout) -->
        <g id="comp-hedgehog" style="display:none; cursor:pointer;" onclick="tapCompanion('hedgehog')">
